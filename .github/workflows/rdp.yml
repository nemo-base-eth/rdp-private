name: RDP Server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run duration (hours)'
        required: false
        default: '4'

env:
  RDP_USERNAME: hkpBHMzC6u9FY
  RDP_PASSWORD: TMq2sbT5GrXNnQ0D1OUa

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Create RDP User
        run: |
          $secPassword = ConvertTo-SecureString "${{ env.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "${{ env.RDP_USERNAME }}" -Password $secPassword -FullName "RDP User" -Description "GitHub Actions RDP" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "${{ env.RDP_USERNAME }}"
          Write-Host "User created: ${{ env.RDP_USERNAME }}"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP enabled"

      - name: Install tools
        run: |
          choco install googlechrome vscode python nodejs-lts 7zip -y --no-progress
          Write-Host "Tools installed"

      - name: Start RDP tunnel (serveo)
        run: |
          # Download ssh if needed
          if (!(Test-Path "C:\ssh")) { mkdir "C:\ssh" }
          
          # Use Cloudflare tunnel as alternative
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\ssh\cloudflared.exe"
          
          # Start tunnel in background
          Start-Process -FilePath "C:\ssh\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -NoNewWindow -RedirectStandardOutput "C:\ssh\tunnel.log"
          
          Start-Sleep -Seconds 10
          
          # Extract tunnel URL from logs
          $log = Get-Content "C:\ssh\tunnel.log" -Raw
          Write-Host "Tunnel log: $log"
          
          # Try to find the URL
          if ($log -match "https://[a-z0-9-]+\.trycloudflare\.com") {
            $tunnelUrl = $matches[0]
            Write-Host "Tunnel URL: $tunnelUrl"
            echo "TUNNEL_URL=$tunnelUrl" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Could not parse tunnel URL, checking again..."
            Start-Sleep -Seconds 5
            $log = Get-Content "C:\ssh\tunnel.log" -Raw
            Write-Host "Tunnel log (retry): $log"
          }

      - name: Keep alive
        run: |
          $duration = [int]("${{ inputs.duration || '4' }}") * 3600
          $endTime = (Get-Date).AddSeconds($duration)
          
          Write-Host "=============================="
          Write-Host "  RDP Server Running"  
          Write-Host "=============================="
          Write-Host "Username: ${{ env.RDP_USERNAME }}"
          Write-Host "Password: ${{ env.RDP_PASSWORD }}"
          Write-Host "Duration: ${{ inputs.duration || '4' }} hours"
          Write-Host "=============================="
          
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "Remaining: $($remaining.Hours)h $($remaining.Minutes)m"
            Start-Sleep -Seconds 60
          }

      - name: Print connection info
        if: always()
        run: |
          Write-Host "=============================="
          Write-Host "  RDP Credentials"
          Write-Host "=============================="
          Write-Host "Username: ${{ env.RDP_USERNAME }}"
          Write-Host "Password: ${{ env.RDP_PASSWORD }}"
          Write-Host "=============================="
          Write-Host "Check tunnel URL in logs above"
          Write-Host "Use any RDP client to connect"
          Write-Host "=============================="
