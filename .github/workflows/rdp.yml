name: RDP Server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run duration (hours)'
        required: false
        default: '4'

env:
  RDP_USERNAME: hkpBHMzC6u9FY
  RDP_PASSWORD: TMq2sbT5GrXNnQ0D1OUa

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Create RDP User
        run: |
          $secPassword = ConvertTo-SecureString "${{ env.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "${{ env.RDP_USERNAME }}" -Password $secPassword -FullName "RDP User" -Description "GitHub Actions RDP" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "${{ env.RDP_USERNAME }}"
          Write-Host "User created: ${{ env.RDP_USERNAME }}"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP enabled on port 3389"

      - name: Install Chrome Remote Desktop
        run: |
          Write-Host "Downloading Chrome Remote Desktop..."
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile "$env:TEMP\chromeremotedesktop.msi"
          Write-Host "Installing..."
          Start-Process msiexec.exe -ArgumentList "/i $env:TEMP\chromeremotedesktop.msi /quiet /norestart" -Wait
          Write-Host "Chrome Remote Desktop installed"

      - name: Setup CRD
        run: |
          # Start the service
          Start-Service "chromeremotedesktophost" -ErrorAction SilentlyContinue
          
          # Get machine name
          $machineName = $env:COMPUTERNAME
          Write-Host "Machine Name: $machineName"
          
          Write-Host ""
          Write-Host "=============================="
          Write-Host "SETUP INSTRUCTIONS"
          Write-Host "=============================="
          Write-Host "1. Buka: https://remotedesktop.google.com/access"
          Write-Host "2. Login Google account kamu"
          Write-Host "3. Klik 'Set up remote access'"
          Write-Host "4. Download & install host (if needed)"
          Write-Host "5. Set PIN: ${{ env.RDP_PASSWORD }}"
          Write-Host "6. Computer name: $machineName"
          Write-Host "=============================="

      - name: Keep alive
        run: |
          $duration = [int]("${{ inputs.duration || '4' }}") * 3600
          $endTime = (Get-Date).AddSeconds($duration)
          
          Write-Host "=============================="
          Write-Host "  RDP SERVER RUNNING"
          Write-Host "=============================="
          Write-Host "Username: ${{ env.RDP_USERNAME }}"
          Write-Host "Password: ${{ env.RDP_PASSWORD }}"
          Write-Host "Duration: ${{ inputs.duration || '4' }} hours"
          Write-Host "=============================="
          
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "[$(Get-Date -Format 'HH:mm')] Remaining: $($remaining.Hours)h $($remaining.Minutes)m"
            Start-Sleep -Seconds 60
          }
          
          Write-Host "Session ended."

      - name: Print connection info
        if: always()
        run: |
          Write-Host ""
          Write-Host "=============================="
          Write-Host "  RDP CREDENTIALS"
          Write-Host "=============================="
          Write-Host ""
          Write-Host "Username : ${{ env.RDP_USERNAME }}"
          Write-Host "Password : ${{ env.RDP_PASSWORD }}"
          Write-Host ""
          Write-Host "=============================="
          Write-Host "  CARA CONNECT"
          Write-Host "=============================="
          Write-Host ""
          Write-Host "Chrome Remote Desktop:"
          Write-Host "  1. Buka https://remotedesktop.google.com/access"
          Write-Host "  2. Login Google account"
          Write-Host "  3. Klik computer ini"
          Write-Host ""
          Write-Host "Atau via Tailscale (kalau install):"
          Write-Host "  tailscale ip -4"
          Write-Host "  mstsc <tailscale-ip>"
          Write-Host ""
          Write-Host "=============================="
