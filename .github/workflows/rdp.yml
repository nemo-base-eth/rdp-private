name: RDP Server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run duration (hours)'
        required: false
        default: '4'

env:
  RDP_USERNAME: hkpBHMzC6u9FY
  RDP_PASSWORD: TMq2sbT5GrXNnQ0D1OUa

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Write-Host "Installing..."
          Start-Process msiexec.exe -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" -Wait
          Write-Host "Tailscale installed"

      - name: Tailscale Login
        id: ts_login
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          
          # Run login and capture output
          Write-Host "Starting Tailscale login..."
          $login = Start-Process $ts -ArgumentList "login" -NoNewWindow -PassThru -RedirectStandardOutput "$env:TEMP\ts_out.txt" -RedirectStandardError "$env:TEMP\ts_err.txt"
          
          # Wait for URL to appear
          Start-Sleep -Seconds 10
          
          $out = Get-Content "$env:TEMP\ts_out.txt" -Raw -ErrorAction SilentlyContinue
          $err = Get-Content "$env:TEMP\ts_err.txt" -Raw -ErrorAction SilentlyContinue
          
          Write-Host "stdout: $out"
          Write-Host "stderr: $err"
          
          # Try extract URL from both
          $combined = "$out $err"
          if ($combined -match "https://login\.tailscale\.com/a/[^\s]+") {
            $url = $matches[0]
            Write-Host ""
            Write-Host "========================================"
            Write-Host "BUKA LINK INI DI BROWSER:"
            Write-Host "========================================"
            Write-Host $url
            Write-Host "========================================"
            echo "TS_URL=$url" >> $env:GITHUB_OUTPUT
          }
          
          # Wait for login process to finish (user auth)
          Write-Host ""
          Write-Host "Menunggu kamu login..."
          $login.WaitForExit(300000)  # 5 min max
          Write-Host "Login process selesai, exit code: $($login.ExitCode)"

      - name: Get Tailscale IP
        id: ts_ip
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          
          Write-Host "Checking Tailscale status..."
          & $ts status
          
          Start-Sleep -Seconds 3
          $ip = & $ts ip -4 2>&1
          Write-Host "Tailscale IP: $ip"
          echo "IP=$ip" >> $env:GITHUB_OUTPUT

      - name: Create User & Enable RDP
        run: |
          # Create user
          $pass = ConvertTo-SecureString "${{ env.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "${{ env.RDP_USERNAME }}" -Password $pass -FullName "RDP User" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "${{ env.RDP_USERNAME }}"
          
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          Write-Host "RDP enabled, user created"

      - name: Keep alive
        run: |
          $hrs = [int]("${{ inputs.duration || '4' }}")
          $end = (Get-Date).AddHours($hrs)
          
          Write-Host "========================================"
          Write-Host "RDP SERVER RUNNING - $hrs JAM"
          Write-Host "========================================"
          Write-Host "IP       : ${{ steps.ts_ip.outputs.IP }}"
          Write-Host "Port     : 3389"
          Write-Host "Username : ${{ env.RDP_USERNAME }}"
          Write-Host "Password : ${{ env.RDP_PASSWORD }}"
          Write-Host "========================================"
          
          while ((Get-Date) -lt $end) {
            $rem = $end - (Get-Date)
            Write-Host "[$(Get-Date -Format 'HH:mm')] Sisa: $($rem.Hours)j $($rem.Minutes)m"
            Start-Sleep -Seconds 60
          }

      - name: Output Info
        if: always()
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP CONNECTION INFO"
          Write-Host "========================================"
          Write-Host "IP       : ${{ steps.ts_ip.outputs.IP }}"
          Write-Host "Port     : 3389"
          Write-Host "Username : ${{ env.RDP_USERNAME }}"
          Write-Host "Password : ${{ env.RDP_PASSWORD }}"
          Write-Host "========================================"
          Write-Host "Cara connect:"
          Write-Host "  1. Buka Remote Desktop (mstsc)"
          Write-Host "  2. Masukkan: ${{ steps.ts_ip.outputs.IP }}"
          Write-Host "  3. Login: ${{ env.RDP_USERNAME }}"
          Write-Host "  4. Password: ${{ env.RDP_PASSWORD }}"
          Write-Host "========================================"
