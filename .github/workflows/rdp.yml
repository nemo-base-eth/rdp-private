name: RDP Server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run duration (hours)'
        required: false
        default: '4'

env:
  RDP_USERNAME: hkpBHMzC6u9FY

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait
          Start-Sleep -Seconds 30
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $found = (where.exe tailscale 2>$null | Select-Object -First 1)
            if ($found) { $ts = $found.Trim() }
          }
          if (-not (Test-Path $ts)) { Write-Error "tailscale install gagal"; exit 1 }
          try { Start-Service Tailscale -ErrorAction SilentlyContinue } catch {}
          $global:LASTEXITCODE = 0
          Write-Host "Tailscale ready"

      - name: Tailscale Login
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $found = (where.exe tailscale 2>$null | Select-Object -First 1)
            if ($found) { $ts = $found.Trim() }
          }
          if (-not (Test-Path $ts)) { Write-Error "tailscale not found"; exit 1 }

          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if (-not $authKey) {
            Write-Error "Set TAILSCALE_AUTH_KEY secret in repo settings"
            exit 1
          }

          & $ts up --authkey="$authKey"
          if ($LASTEXITCODE -ne 0) { Write-Error "Tailscale auth failed"; exit 1 }
          Write-Host "Tailscale connected"
          $global:LASTEXITCODE = 0

      - name: Get Tailscale IP
        id: ts_ip
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $found = (where.exe tailscale 2>$null | Select-Object -First 1)
            if ($found) { $ts = $found.Trim() }
          }
          $ip = ""
          for ($i = 1; $i -le 10; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            $global:LASTEXITCODE = 0
            if ($ip) { $ip = $ip.Trim() }
            if ($ip -match '^100\.') { break }
            Start-Sleep -Seconds 3
          }
          if (-not $ip) { Write-Error "IP tidak ketemu"; exit 1 }
          "IP=$ip" >> $env:GITHUB_OUTPUT

      - name: Create User
        id: create
        shell: pwsh
        run: |
          $u = $env:RDP_USERNAME
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#' -split ''
          $p = -join (1..16 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Count)] })
          net user $u $p /add 2>$null
          net localgroup Administrators $u /add 2>$null
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -PropertyType DWORD -Force 2>$null
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' 2>$null
          "PASS=$p" >> $env:GITHUB_OUTPUT

      - name: Output
        shell: pwsh
        run: |
          $ip = (Get-Content "$env:GITHUB_OUTPUT" | Where-Object { $_ -match '^IP=' }) -replace '^IP=',''
          $pass = (Get-Content "$env:GITHUB_OUTPUT" | Where-Object { $_ -match '^PASS=' }) -replace '^PASS=',''
          Write-Host ""
          Write-Host "========================================"
          Write-Host "IP    : $ip"
          Write-Host "PORT  : 3389"
          Write-Host "USER  : $env:RDP_USERNAME"
          Write-Host "PASS  : $pass"
          Write-Host "========================================"

      - name: Keep alive
        shell: pwsh
        run: |
          $hrs = [int]("${{ github.event.inputs.duration }}" -replace '[^0-9]','')
          if ($hrs -lt 1) { $hrs = 4 }
          $end = (Get-Date).AddHours($hrs)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 1800
            $rem = $end - (Get-Date)
            Write-Host "Sisa: $($rem.Hours)j $($rem.Minutes)m"
          }
