name: RDP Server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run duration (hours)'
        required: false
        default: '4'

env:
  RDP_USERNAME: hkpBHMzC6u9FY
  RDP_PASSWORD: TMq2sbT5GrXNnQ0D1OUa
  TAILSCALE_PATH: "C:\\Program Files\\Tailscale\\tailscale.exe"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download & Install Tailscale
        run: |
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale-setup.msi"
          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe -ArgumentList "/i $env:TEMP\tailscale-setup.msi /quiet /norestart" -Wait
          Write-Host "Tailscale installed"
          
          # Verify installation
          if (Test-Path "${{ env.TAILSCALE_PATH }}") {
            Write-Host "Tailscale CLI found at: ${{ env.TAILSCALE_PATH }}"
          } else {
            Write-Host "Tailscale CLI not found, checking other locations..."
            Get-ChildItem "C:\Program Files\Tailscale" -ErrorAction SilentlyContinue
            Get-ChildItem "C:\Program Files (x86)\Tailscale" -ErrorAction SilentlyContinue
          }

      - name: Login Tailscale
        id: tailscale_login
        run: |
          Write-Host "Starting Tailscale login..."
          
          # Start tailscale login
          $process = Start-Process -FilePath "${{ env.TAILSCALE_PATH }}" -ArgumentList "login" -NoNewWindow -PassThru -RedirectStandardOutput "$env:TEMP\tailscale_login.txt" -RedirectStandardError "$env:TEMP\tailscale_error.txt"
          
          # Wait a bit for the URL to appear
          Start-Sleep -Seconds 5
          
          # Read output
          $output = Get-Content "$env:TEMP\tailscale_login.txt" -Raw -ErrorAction SilentlyContinue
          $error_output = Get-Content "$env:TEMP\tailscale_error.txt" -Raw -ErrorAction SilentlyContinue
          
          Write-Host "Output: $output"
          Write-Host "Error: $error_output"
          
          # Extract login URL
          $fullOutput = "$output $error_output"
          if ($fullOutput -match "https://login\.tailscale\.com/a/\S+") {
            $loginUrl = $matches[0]
            Write-Host ""
            Write-Host "=============================="
            Write-Host "LOGIN TAILSCALE"
            Write-Host "=============================="
            Write-Host "Buka link ini di browser:"
            Write-Host $loginUrl
            Write-Host "=============================="
            echo "LOGIN_URL=$loginUrl" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Could not extract login URL from output"
          }
          
          # Wait for process to complete or timeout
          $timeout = 300  # 5 minutes
          $elapsed = 0
          while (!$process.HasExited -and $elapsed -lt $timeout) {
            Start-Sleep -Seconds 5
            $elapsed += 5
            Write-Host "Waiting for auth... ($elapsed/$timeout seconds)"
          }
          
          if ($process.HasExited) {
            Write-Host "Login process completed with exit code: $($process.ExitCode)"
          } else {
            Write-Host "Login timeout, stopping process..."
            $process.Kill()
          }

      - name: Get Tailscale IP
        id: tailscale
        run: |
          Start-Sleep -Seconds 3
          
          # Get IP using full path
          $tsIP = & "${{ env.TAILSCALE_PATH }}" ip -4 2>&1
          Write-Host "Tailscale IPv4: $tsIP"
          echo "TS_IP=$tsIP" >> $env:GITHUB_OUTPUT
          
          # Show status
          & "${{ env.TAILSCALE_PATH }}" status 2>&1

      - name: Create RDP User
        run: |
          $secPassword = ConvertTo-SecureString "${{ env.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "${{ env.RDP_USERNAME }}" -Password $secPassword -FullName "RDP User" -Description "GitHub Actions RDP" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "${{ env.RDP_USERNAME }}"
          Write-Host "User created: ${{ env.RDP_USERNAME }}"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP enabled on port 3389"

      - name: Install tools
        run: |
          choco install vscode python nodejs-lts 7zip -y --no-progress
          Write-Host "Tools installed"

      - name: Keep alive
        run: |
          $duration = [int]("${{ inputs.duration || '4' }}") * 3600
          $endTime = (Get-Date).AddSeconds($duration)
          
          Write-Host "=============================="
          Write-Host "  RDP SERVER RUNNING"
          Write-Host "=============================="
          Write-Host "Tailscale IP: ${{ steps.tailscale.outputs.TS_IP }}"
          Write-Host "Port: 3389"
          Write-Host "Username: ${{ env.RDP_USERNAME }}"
          Write-Host "Password: ${{ env.RDP_PASSWORD }}"
          Write-Host "Duration: ${{ inputs.duration || '4' }} hours"
          Write-Host "=============================="
          
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "[$(Get-Date -Format 'HH:mm')] Remaining: $($remaining.Hours)h $($remaining.Minutes)m"
            Start-Sleep -Seconds 60
          }
          
          Write-Host "Session ended."

      - name: Print connection info
        if: always()
        run: |
          Write-Host ""
          Write-Host "=============================="
          Write-Host "  RDP CONNECTION INFO"
          Write-Host "=============================="
          Write-Host ""
          Write-Host "Tailscale IP: ${{ steps.tailscale.outputs.TS_IP }}"
          Write-Host "Port        : 3389"
          Write-Host "Username    : ${{ env.RDP_USERNAME }}"
          Write-Host "Password    : ${{ env.RDP_PASSWORD }}"
          Write-Host ""
          Write-Host "Cara connect:"
          Write-Host "  1. Buka Remote Desktop (mstsc)"
          Write-Host "  2. Masukkan: ${{ steps.tailscale.outputs.TS_IP }}"
          Write-Host "  3. Login dengan credentials di atas"
          Write-Host "=============================="
