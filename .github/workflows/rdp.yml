name: RDP Server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run duration (hours)'
        required: false
        default: '4'

# Simple version: creds sama kayak README.
env:
  RDP_USERNAME: hkpBHMzC6u9FY
  RDP_PASSWORD: TMq2sbT5GrXNnQ0D1OUa

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait
          Start-Sleep -Seconds 30
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $found = (where.exe tailscale 2>$null | Select-Object -First 1)
            if ($found) { $ts = $found.Trim() }
          }
          if (-not (Test-Path $ts)) { Write-Error "tailscale install gagal"; exit 1 }
          try { Start-Service Tailscale -ErrorAction SilentlyContinue } catch {}
          $global:LASTEXITCODE = 0
          Write-Host "Tailscale ready"

      - name: Tailscale Login (manual)
        id: ts_login
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $found = (where.exe tailscale 2>$null | Select-Object -First 1)
            if ($found) { $ts = $found.Trim() }
          }
          $outFile = "$env:TEMP\ts_out.txt"
          $errFile = "$env:TEMP\ts_err.txt"
          Remove-Item $outFile -ErrorAction SilentlyContinue
          Remove-Item $errFile -ErrorAction SilentlyContinue
          $login = Start-Process $ts -ArgumentList "login" -NoNewWindow -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $url = $null
          for ($i = 1; $i -le 18; $i++) {
            Start-Sleep -Seconds 5
            $out = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
            $combined = "$out $err"
            if ($combined -match 'https://login\.tailscale\.com/a/[^\s''"]+') { $url = $matches[0]; break }
            if ($login.HasExited -and (-not $out) -and (-not $err) -and $i -ge 3) { break }
          }
          if (-not $url) {
            try { Stop-Process -Id $login.Id -Force -ErrorAction SilentlyContinue } catch {}
            Remove-Item $outFile -ErrorAction SilentlyContinue
            Remove-Item $errFile -ErrorAction SilentlyContinue
            $login2 = Start-Process $ts -ArgumentList "up" -NoNewWindow -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            for ($i = 1; $i -le 12; $i++) {
              Start-Sleep -Seconds 5
              $out = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
              $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
              $combined = "$out $err"
              if ($combined -match 'https://login\.tailscale\.com/a/[^\s''"]+') { $url = $matches[0]; $login = $login2; break }
              if ($login2.HasExited) { break }
            }
            if (-not $url -and -not $login2.HasExited) { $login = $login2 }
          }
          if (-not $url) { Write-Error "Gagal dapat link login. Re-run."; exit 1 }
          Write-Host ""
          Write-Host "========================================"
          Write-Host "LOGIN DI BROWSER:"
          Write-Host $url
          Write-Host "========================================"
          "TS_URL=$url" >> $env:GITHUB_OUTPUT
          $deadline = (Get-Date).AddMinutes(10)
          $loggedIn = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            $ipTry = (& $ts ip -4 2>$null | Select-Object -First 1)
            $global:LASTEXITCODE = 0
            if ($ipTry -and $ipTry -match '^100\.') { $loggedIn = $true; break }
          }
          if (-not $loggedIn) { Write-Error "Timeout login. Re-run."; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Get Tailscale IP
        id: ts_ip
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $found = (where.exe tailscale 2>$null | Select-Object -First 1)
            if ($found) { $ts = $found.Trim() }
          }
          $ip = ""
          for ($i = 1; $i -le 6; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            $global:LASTEXITCODE = 0
            if ($ip) { $ip = $ip.Trim() }
            if ($ip -match '^100\.') { break }
            Start-Sleep -Seconds 5
          }
          if (-not $ip) { Write-Error "IP tidak ketemu"; exit 1 }
          "IP=$ip" >> $env:GITHUB_OUTPUT

      - name: Create User & Enable RDP
        id: create
        shell: pwsh
        run: |
          $u = $env:RDP_USERNAME
          $p = $env:RDP_PASSWORD
          $pass = ConvertTo-SecureString $p -AsPlainText -Force
          try {
            New-LocalUser -Name $u -Password $pass -FullName "RDP User" -PasswordNeverExpires -ErrorAction Stop | Out-Null
          } catch {
            Set-LocalUser -Name $u -Password $pass
          }
          $global:LASTEXITCODE = 0
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          $global:LASTEXITCODE = 0
          "USER=$u" >> $env:GITHUB_OUTPUT
          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP SIAP"
          Write-Host "IP       : ${{ steps.ts_ip.outputs.IP }}"
          Write-Host "Username : $u"
          Write-Host "Password : $p"
          Write-Host "========================================"

      - name: Keep alive
        shell: pwsh
        run: |
          $hrsRaw = "${{ github.event.inputs.duration }}"
          if (-not $hrsRaw) { $hrsRaw = "4" }
          $hrs = [int]$hrsRaw
          $end = (Get-Date).AddHours($hrs)
          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP RUNNING $hrs JAM"
          Write-Host "IP       : ${{ steps.ts_ip.outputs.IP }}"
          Write-Host "Username : ${{ steps.create.outputs.USER }}"
          Write-Host "Password : ${{ env.RDP_PASSWORD }}"
          Write-Host "========================================"
          Write-Host "Connect: mstsc -> ${{ steps.ts_ip.outputs.IP }}"
          Write-Host "========================================"
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 1800
            $rem = $end - (Get-Date)
            Write-Host "Sisa: $($rem.Hours)j $($rem.Minutes)m"
          }

      - name: Output Info
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP INFO"
          Write-Host "IP       : ${{ steps.ts_ip.outputs.IP }}"
          Write-Host "Username : ${{ steps.create.outputs.USER }}"
          Write-Host "Password : ${{ env.RDP_PASSWORD }}"
          Write-Host "========================================"
